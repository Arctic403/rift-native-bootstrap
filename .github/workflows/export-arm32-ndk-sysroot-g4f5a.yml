name: Export Android ARM32 API28 NDK sysroot G4-F5A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-g4f5a:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NDK_VERSION: '27.2.12479018'
      LLVM_VERSION: '21.1.8'
      LLVM_SHA256: '4633a23617fa31a3ea51242586ea7fb1da7140e426bd62fc164261fe036aa142'
    steps:
      - name: Checkout bootstrap (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate isolated exporter and storage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native/package-android-arm32-sysroot-g4f5.py native/test-g4f5a-exporter.py
          python3 native/test-g4f5a-exporter.py
          python3 native/package-android-arm32-sysroot-g4f5.py --help
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 4194304
          df -h .

      - name: Install and verify exact official Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"
          NDK_HOME="$SDK_ROOT/ndk/$NDK_VERSION"
          grep -Fx "Pkg.Revision = $NDK_VERSION" "$NDK_HOME/source.properties"
          test -f "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/stdio.h"
          test -f "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/28/crtbegin_dynamic.o"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Fetch only SHA-pinned official LLVM 21.1.8 headers source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/g4f5a/cache
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz"
          ARCHIVE="out/g4f5a/cache/llvm-project-$LLVM_VERSION.src.tar.xz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$URL" -o "$ARCHIVE"
          printf '%s  %s\n' "$LLVM_SHA256" "$ARCHIVE" | sha256sum --check

      - name: Package and independently verify bounded native subset
        shell: bash
        run: |
          set -euo pipefail
          python3 native/package-android-arm32-sysroot-g4f5.py \
            --ndk "$ANDROID_NDK_HOME" \
            --llvm-archive "out/g4f5a/cache/llvm-project-$LLVM_VERSION.src.tar.xz" \
            --output out/g4f5a/release
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          root = Path('out/g4f5a/release')
          receipt = json.loads((root/'G4F5A-TRANSFER-RECEIPT.json').read_text())
          blob = root / receipt['zip']
          assert hashlib.sha256(blob.read_bytes()).hexdigest() == receipt['zipSha256']
          with zipfile.ZipFile(blob) as z:
              names = set(z.namelist())
              for name in ('sysroot/usr/include/stdio.h',
                           'sysroot/usr/include/stdlib.h',
                           'sysroot/usr/lib/arm-linux-androideabi/28/crtbegin_dynamic.o',
                           'sysroot/usr/lib/arm-linux-androideabi/28/crtend_android.o',
                           'sysroot/usr/lib/arm-linux-androideabi/28/libc.so',
                           'clang-resource/include/stdarg.h',
                           'clang-resource/include/stddef.h',
                           'LICENSES/LLVM-LICENSE.txt',
                           'SHA256SUMS.txt','build-info.json'):
                  assert name in names, name
              assert len(names) == receipt['entries']
              assert all(z.getinfo(name).file_size <= 16*1024*1024 for name in names)
              print('PASS G4-F5A CI artifact/receipt:',receipt['zip'],len(names),'files')
          PY

      - name: Upload provenance-checked G4-F5A bootstrap for manual Android import
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riftndk-sysroot-arm32-api28-r27c-llvm21
          path: |
            out/g4f5a/release/riftndk-sysroot-arm32-api28-r27c-llvm21.zip
            out/g4f5a/release/G4F5A-TRANSFER-RECEIPT.json
          if-no-files-found: error
          retention-days: 30
